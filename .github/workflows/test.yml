name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: ${{ matrix.shell }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell:
          - powershell
          - pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run offline test suite
        shell: ${{ matrix.shell }}
        run: .\tests\Test-Common.ps1
